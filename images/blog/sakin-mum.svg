<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" role="img" aria-label="Lavanta ve ardıç dalları arasında duran, yanan küçük bir cam kavanoz soya mumu çizimi">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffe9a8" stop-opacity=".75"/><stop offset=".45" stop-color="#ffd27a" stop-opacity=".22"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
    <radialGradient id="flame" cx="50%" cy="72%" r="60%"><stop offset="0" stop-color="#fffdf0"/><stop offset=".35" stop-color="#ffe08a"/><stop offset=".8" stop-color="#ff9f43"/><stop offset="1" stop-color="#ff9f43" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" x2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset=".25" stop-color="#e9efd2" stop-opacity=".35"/><stop offset=".75" stop-color="#cfd9b0" stop-opacity=".3"/><stop offset="1" stop-color="#ffffff" stop-opacity=".5"/></linearGradient>
    <linearGradient id="wax" x1="0" x2="1"><stop offset="0" stop-color="#efe3c6"/><stop offset=".45" stop-color="#fbf4e2"/><stop offset="1" stop-color="#e3d4b0"/></linearGradient>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <ellipse cx="200" cy="482" rx="132" ry="15" fill="#1a2010" opacity=".3" filter="url(#blur)"/>
  <circle cx="200" cy="168" r="165" fill="url(#glow)"/>
