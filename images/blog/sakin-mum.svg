    <ellipse cx="366" cy="350" rx="5" ry="9"/><ellipse cx="363" cy="366" rx="6" ry="9"/><ellipse cx="360" cy="382" rx="6" ry="9"/>
    <ellipse cx="306" cy="352" rx="5" ry="9"/><ellipse cx="305" cy="368" rx="6" ry="9"/><ellipse cx="303" cy="384" rx="6" ry="9"/>
