  <g fill="#b9a6de" opacity=".8"><ellipse cx="341" cy="326" rx="3" ry="6"/><ellipse cx="338" cy="342" rx="3" ry="6"/><ellipse cx="369" cy="358" rx="3" ry="6"/></g>
  <!-- kavanoz -->
  <rect x="113" y="238" width="174" height="226" rx="22" fill="url(#wax)"/>
  <ellipse cx="200" cy="240" rx="87" ry="13" fill="#fffaf0"/>
  <ellipse cx="200" cy="241" rx="30" ry="4.5" fill="#e3d4b0"/>
  <rect x="104" y="226" width="192" height="246" rx="28" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".6" stroke-width="2"/>
  <rect x="121" y="248" width="12" height="190" rx="6" fill="#ffffff" opacity=".4"/>
  <!-- etiket -->
  <rect x="142" y="332" width="116" height="92" rx="7" fill="#f4efe2" stroke="#cfbb99" stroke-width="1.2"/>
  <g fill="none" stroke="#5c7a3a" stroke-width="1.6" stroke-linecap="round"><path d="M200 372 v-24"/><path d="M200 358 c-7 -3 -9 -9 -8 -14 M200 358 c7 -3 9 -9 8 -14 M200 366 c-6 -2 -8 -7 -7 -11 M200 366 c6 -2 8 -7 7 -11"/></g>
